<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c0b14" />
  <meta name="description" content="ARCADE 로그인 — 회원 계정으로 게임 커뮤니티에 접속하세요." />
  <title>로그인 — ARCADE</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <header class="topbar">
    <div class="shell nav">
      <a class="logo" href="index.html" aria-label="ARCADE 홈"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 8.5h10a4 4 0 0 1 3.8 5.2l-.7 2.3a2.5 2.5 0 0 1-4 1.2l-2.2-1.7h-3.8l-2.2 1.7a2.5 2.5 0 0 1-4-1.2l-.7-2.3A4 4 0 0 1 7 8.5Z" stroke="white" stroke-width="1.8"/><path d="M8 11v4m-2-2h4m7-1h.01M18 14h.01" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg></span>ARCADE</a>
      <nav class="nav-links" aria-label="메인 메뉴"><a href="index.html#games">게임 둘러보기</a><a href="board.html">게시판</a><a class="active" href="login.html" aria-current="page">로그인</a></nav>
    </div>
  </header>

  <main class="shell auth-page">
    <section class="auth-shell login-shell" aria-labelledby="loginTitle">
      <header class="auth-heading">
        <p class="section-kicker">WELCOME BACK</p>
        <h1 id="loginTitle">다시 만나 반가워요.</h1>
        <p>ARCADE 계정으로 로그인해 주세요.</p>
      </header>
      <form class="auth-form" id="loginForm" novalidate>
        <div><label for="email">이메일 주소</label><input id="email" name="email" type="email" maxlength="254" autocomplete="email" required placeholder="you@example.com" /></div>
        <div><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="비밀번호를 입력해 주세요" /></div>
        <p class="auth-message" id="loginMessage" role="status" aria-live="polite"></p>
        <button class="button" type="submit">로그인</button>
        <p class="auth-switch">아직 계정이 없나요? <a href="signup.html">회원가입</a></p>
      </form>
    </section>
    <section class="auth-shell account-shell" id="accountPanel" hidden aria-labelledby="accountTitle">
      <header class="auth-heading"><p class="section-kicker">ACCOUNT</p><h1 id="accountTitle">로그인되어 있어요</h1><p>현재 브라우저의 세션으로 로그인했습니다.</p></header>
      <div class="auth-form"><div class="auth-profile-card"><p>닉네임: <strong id="accountNickname"></strong></p><p>이메일: <strong id="accountEmail"></strong></p><button class="button secondary" id="logoutButton" type="button">로그아웃</button></div></div>
    </section>
  </main>

  <footer><div class="shell"><a class="footer-logo" href="index.html">ARCADE</a><span>© 2026 ARCADE · PLAY YOUR WAY</span></div></footer>
  <script src="auth.js"></script>
</body>
</html>
