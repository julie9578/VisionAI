<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">ARCADE — 나만의 다음 게임을 발견하세요</title>
  <desc id="description">인기 게임을 탐색하고 취향에 맞는 다음 플레이를 찾아보는 ARCADE 게임 라운지</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#211c35"/><stop offset="1" stop-color="#0c0b14"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9c76ff"/><stop offset="1" stop-color="#ff70bb"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#9c76ff" stop-opacity=".35"/><stop offset="1" stop-color="#9c76ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/><rect width="1200" height="630" fill="url(#grid)"/><circle cx="880" cy="315" r="340" fill="url(#glow)"/>
  <rect x="76" y="78" width="58" height="58" rx="18" fill="url(#accent)"/>
  <path d="M93 98h24a10 10 0 0 1 9.5 13l-1.7 5.7a6.3 6.3 0 0 1-10 3l-5.3-4h-9l-5.3 4a6.3 6.3 0 0 1-10-3l-1.7-5.7a10 10 0 0 1 9.5-13Z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <path d="M96 104v12m-6-6h12m17-3h.1m4 7h.1" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="151" y="119" fill="#f6f3ff" font-family="Arial,sans-serif" font-size="35" font-weight="800" letter-spacing="3">ARCADE</text>
  <text x="78" y="287" fill="#d9c6ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="7">YOUR NEXT ADVENTURE</text>
  <text x="72" y="383" fill="#f6f3ff" font-family="Arial,sans-serif" font-size="67" font-weight="800">다음 플레이,</text>
  <text x="72" y="472" fill="#f6f3ff" font-family="Arial,sans-serif" font-size="67" font-weight="800">여기서 찾아봐.</text>
  <text x="78" y="536" fill="#b5b1c5" font-family="Arial,sans-serif" font-size="25">인기 게임을 탐색하고 나만의 다음 모험을 발견하세요</text>
  <circle cx="951" cy="331" r="163" fill="#ffffff08" stroke="#ffffff20" stroke-width="2"/><circle cx="951" cy="331" r="137" fill="url(#accent)" opacity=".16"/>
  <text x="951" y="374" text-anchor="middle" font-family="Arial,sans-serif" font-size="116">&#x1F3AE;</text>
