<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c0b14" />
  <meta name="description" content="ARCADE 게시판에서 게임 이야기를 나누고 새로운 플레이어와 의견을 공유하세요." />
  <title>게시판 — ARCADE</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="board.css" />
</head>
<body>
  <header class="topbar">
    <div class="shell nav">
      <a class="logo" href="index.html" aria-label="ARCADE 홈"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 8.5h10a4 4 0 0 1 3.8 5.2l-.7 2.3a2.5 2.5 0 0 1-4 1.2l-2.2-1.7h-3.8l-2.2 1.7a2.5 2.5 0 0 1-4-1.2l-.7-2.3A4 4 0 0 1 7 8.5Z" stroke="white" stroke-width="1.8"/><path d="M8 11v4m-2-2h4m7-1h.01M18 14h.01" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg></span>ARCADE</a>
      <nav class="nav-links" aria-label="메인 메뉴"><a href="index.html#games">게임 둘러보기</a><a href="index.html#daily">오늘의 게임</a><a class="active" href="board.html" aria-current="page">게시판</a><a href="login.html">로그인</a><a href="signup.html">회원가입</a></nav>
      <div class="nav-actions"><a class="button board-home-link" href="index.html">홈으로</a></div>
    </div>
  </header>

  <main class="shell board-page">
    <section class="board-hero" aria-labelledby="boardTitle">
      <div>
        <p class="section-kicker">ARCADE COMMUNITY</p>
        <h1 id="boardTitle">게임 이야기를<br /><span>나눠보세요.</span></h1>
        <p>추천 게임부터 플레이 후기까지, 플레이어들의 이야기를 한곳에서 만나보세요.</p>
      </div>
      <div class="board-hero-mark" aria-hidden="true">💬</div>
    </section>

    <section class="board-content" aria-labelledby="postListTitle">
      <div class="board-heading">
        <div>
          <p class="section-kicker">COMMUNITY BOARD</p>
          <h2 id="postListTitle">전체 게시글 <span>24</span></h2>
        </div>
      </div>

      <div class="board-toolbar">
        <nav class="board-categories" aria-label="게시글 카테고리">
          <button class="category-chip active" type="button" data-category="" aria-pressed="true">전체</button>
          <button class="category-chip" type="button" data-category="free" aria-pressed="false">자유</button>
          <button class="category-chip" type="button" data-category="recommend" aria-pressed="false">게임 추천</button>
          <button class="category-chip" type="button" data-category="guide" aria-pressed="false">공략·팁</button>
          <button class="category-chip" type="button" data-category="recruit" aria-pressed="false">모집</button>
          <button class="category-chip" type="button" data-category="notice" aria-pressed="false">공지</button>
        </nav>
        <form class="board-search" id="boardSearchForm" role="search">
          <label class="visually-hidden" for="boardSearchCategory">검색할 게시판 분류</label>
          <select id="boardSearchCategory" name="category" aria-label="검색할 게시판 분류">
            <option value="">전체 분류</option>
            <option value="free">자유</option>
            <option value="recommend">게임 추천</option>
            <option value="guide">공략·팁</option>
            <option value="recruit">모집</option>
            <option value="notice">공지</option>
          </select>
          <label class="visually-hidden" for="boardSearchScope">검색 범위</label>
          <select id="boardSearchScope" name="scope" aria-label="검색 범위">
            <option value="all">글+댓글</option>
            <option value="title">제목만</option>
            <option value="author">글작성자</option>
          </select>
          <label class="visually-hidden" for="boardQuery">게시글 검색어</label>
          <input id="boardQuery" name="q" type="search" placeholder="게시글 검색" />
          <button type="submit" aria-label="검색">⌕</button>
        </form>
      </div>

      <p class="board-status" id="boardStatus" role="status" aria-live="polite"></p>
      <div class="post-table-wrap" id="all-posts">
        <table class="post-table">
          <caption class="visually-hidden">ARCADE 게시판 게시글 목록</caption>
          <thead><tr><th scope="col" class="post-category-col">분류</th><th scope="col">제목</th><th scope="col" class="post-author-col">작성자</th><th scope="col" class="post-date-col">날짜</th><th scope="col" class="post-views-col">조회</th><th scope="col" class="post-actions-col">반응</th></tr></thead>
          <tbody id="postRows"></tbody>
        </table>
      </div>

      <nav class="board-pagination" id="boardPagination" aria-label="게시글 페이지"></nav>
      <p class="board-note" id="write-info">글 작성, 댓글, 좋아요와 북마크는 로그인한 회원만 이용할 수 있습니다.</p>
      <div class="board-bottom-actions"><a class="button board-write" href="post-write.html" target="_blank" aria-label="새 탭에서 글쓰기 페이지 열기">✎ 글쓰기</a></div>
    </section>
  </main>



  <script src="board.js"></script>
  <script src="community.js"></script>

  <footer><div class="shell"><a class="footer-logo" href="index.html">ARCADE</a><span>게임을 발견하고, 공식 사이트에서 더 알아보세요.</span><span>© 2026 ARCADE · PLAY YOUR WAY</span></div></footer>
</body>
</html>
