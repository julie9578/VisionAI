<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c0b14" />
  <meta name="description" content="ARCADE 회원가입 — 게임 커뮤니티 계정을 만들어보세요." />
  <title>회원가입 — ARCADE</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <header class="topbar">
    <div class="shell nav">
      <a class="logo" href="index.html" aria-label="ARCADE 홈"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 8.5h10a4 4 0 0 1 3.8 5.2l-.7 2.3a2.5 2.5 0 0 1-4 1.2l-2.2-1.7h-3.8l-2.2 1.7a2.5 2.5 0 0 1-4-1.2l-.7-2.3A4 4 0 0 1 7 8.5Z" stroke="white" stroke-width="1.8"/><path d="M8 11v4m-2-2h4m7-1h.01M18 14h.01" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg></span>ARCADE</a>
      <nav class="nav-links" aria-label="메인 메뉴"><a href="index.html#games">게임 둘러보기</a><a href="board.html">게시판</a><a href="login.html">로그인</a></nav>
    </div>
  </header>

  <main class="shell auth-page">
    <section class="auth-shell" aria-labelledby="signupTitle">
      <header class="auth-heading">
        <p class="section-kicker">JOIN THE COMMUNITY</p>
        <h1 id="signupTitle">ARCADE 회원가입</h1>
        <p>가입 정보를 입력하고 ARCADE를 시작하세요.</p>
      </header>
      <form class="auth-form" id="signupForm" novalidate>
        <div><label for="nickname">닉네임</label><input id="nickname" name="nickname" type="text" minlength="2" maxlength="30" autocomplete="nickname" required placeholder="사용할 닉네임" /><p class="field-hint">2~30자</p></div>
        <div><label for="email">이메일 주소</label><input id="email" name="email" type="email" maxlength="254" autocomplete="email" required placeholder="name@example.com" /></div>
        <div><label for="gender">성별</label><select id="gender" name="gender" required><option value="" selected disabled>성별 선택</option><option value="female">여성</option><option value="male">남성</option><option value="nonbinary">논바이너리</option><option value="prefer_not_to_say">응답하지 않음</option></select></div>
        <div><label for="address">집 주소</label><input id="address" name="address" type="text" minlength="5" maxlength="500" autocomplete="street-address" required placeholder="시·도, 시·군·구, 도로명 주소" /><p class="field-hint">가입 정보로 저장되며, Worker에서 암호화합니다.</p></div>
        <div><label for="password">비밀번호</label><input id="password" name="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required placeholder="10자 이상" /><p class="field-hint">10~128자</p></div>
        <div><label for="passwordConfirm">비밀번호 확인</label><input id="passwordConfirm" name="passwordConfirm" type="password" minlength="10" maxlength="128" autocomplete="new-password" required placeholder="비밀번호 다시 입력" /></div>
        <div class="auth-privacy">계정 정보는 데이터베이스에 저장됩니다. 비밀번호는 해시 처리하고, 집 주소는 암호화해 보관합니다.</div>
        <p class="auth-message" id="signupMessage" role="status" aria-live="polite"></p>
        <button class="button" type="submit">계정 만들기</button>
        <p class="auth-switch">이미 계정이 있나요? <a href="login.html">로그인</a></p>
      </form>
    </section>
  </main>

  <footer><div class="shell"><a class="footer-logo" href="index.html">ARCADE</a><span>© 2026 ARCADE · PLAY YOUR WAY</span></div></footer>
  <script src="auth.js"></script>
</body>
</html>
