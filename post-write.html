<body>
  <header class="topbar"><div class="shell nav"><a class="logo" href="index.html" aria-label="ARCADE 홈"><span class="logo-mark">🎮</span>ARCADE</a><a class="back-link" href="board.html">← 게시판으로</a></div></header>
  <main class="shell community-page">
    <section class="community-editor" id="editorPanel" hidden>
      <header class="community-page-heading"><p class="section-kicker">COMMUNITY WRITE</p><h1>새 글 작성</h1><p>게임을 좋아하는 사람들과 이야기를 나눠보세요.</p></header>
      <form class="editor-form" id="writeForm">
        <div class="editor-row"><label for="writeCategory">게시판 분류</label><select id="writeCategory" name="category" required><option value="free">자유</option><option value="recommend">게임 추천</option><option value="guide">공략·팁</option><option value="recruit">모집</option></select></div>
        <div class="editor-row"><label for="writeTitle">제목</label><input id="writeTitle" name="title" type="text" maxlength="160" required placeholder="제목을 입력하세요" /></div>
        <div class="editor-row editor-body-row"><label for="writeContent">내용</label><textarea id="writeContent" name="content" rows="14" maxlength="10000" required placeholder="게임 이야기와 의견을 자유롭게 작성하세요."></textarea><span class="editor-hint">최대 10,000자 · 작성자는 로그인된 계정의 닉네임으로 저장됩니다.</span></div>
        <p class="editor-message" id="writeMessage" role="status" aria-live="polite"></p>
        <div class="editor-actions"><a class="button secondary" href="board.html">취소</a><button class="button" type="submit">게시글 등록</button></div>
      </form>
    </section>
    <section class="community-auth-required" id="writeLoginRequired" hidden><h1>로그인이 필요합니다.</h1><p>게시글 작성은 로그인한 회원만 할 수 있습니다.</p><a class="button" href="login.html?next=post-write.html">로그인하기</a></section>
  </main>
  <footer><div class="shell"><a class="footer-logo" href="index.html">ARCADE</a><span>© 2026 ARCADE · PLAY YOUR WAY</span></div></footer>
  <script src="community.js"></script>
</body>
</html>
